<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#32294f"><title>Hjemme med Elias</title><link rel="manifest" href="manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="apple-touch-icon" href="icon.png"><style>
*{box-sizing:border-box}body{margin:0;background:#292342;color:#34294f;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.stage{position:relative;width:min(100vw,500px);margin:auto;aspect-ratio:853/1844;background-image:url('eventyrhus.png');background-size:100% 100%;box-shadow:0 0 40px #151126}.hot{position:absolute;background:transparent;border:0;cursor:pointer;touch-action:manipulation}.hot:focus-visible{outline:3px solid #fff;border-radius:15px}.shade{position:fixed;inset:0;background:#171329a8;z-index:10;display:none;align-items:flex-end;justify-content:center}.shade.show{display:flex}.sheet{background:linear-gradient(150deg,#fff6eb,#eee4ff);border:2px solid #fff7ed;border-radius:25px 25px 0 0;width:min(100%,520px);max-height:85dvh;overflow:auto;padding:18px 20px max(24px,env(safe-area-inset-bottom));box-shadow:0 -8px 30px #17132966}.sheethead{display:flex;justify-content:space-between;align-items:center;gap:10px}.sheet h2{font-size:22px;margin:5px 0 12px}.sheet h3{font-size:16px;margin:18px 0 8px}.close{border:0;background:#e6d7f5;color:#49386e;border-radius:100px;width:38px;height:38px;font-size:23px}.task{display:flex;gap:10px;align-items:center;border-bottom:1px solid #d9cfe0;padding:11px 0}.task input{accent-color:#59ae91;width:23px;height:23px;flex-shrink:0}.task label{flex:1;line-height:1.35}.task.done label{text-decoration:line-through;opacity:.6}.del{border:0;background:transparent;color:#776b89;font-size:20px;padding:4px}.btn{border:0;border-radius:13px;background:#6a61b0;color:white;padding:12px 15px;font-weight:700;font-size:15px}.btn.secondary{background:#e3d7f2;color:#493b6b}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.actions>*{flex:1}.field{width:100%;padding:12px;border-radius:12px;border:1px solid #cdbdd8;background:white;font-size:16px}.fieldarea{min-height:110px;font-size:13px}p{line-height:1.45}.muted{color:#716780;font-size:13px}.meter{height:13px;border-radius:20px;background:#dcd2e4;overflow:hidden;margin:12px 0}.fill{height:100%;background:linear-gradient(90deg,#66c8a0,#8c84df)}.room{display:flex;align-items:center;justify-content:space-between;width:100%;background:#fff9f3;border:1px solid #e7d9e6;color:#40315d;padding:13px;margin:7px 0;border-radius:14px;text-align:left;font-size:15px}.room b{font-size:13px;color:#766791}.hint{font-size:12px;color:#625679;background:#fff9f1;padding:9px;border-radius:10px}.chip{display:inline-block;background:#e9dff6;padding:7px 11px;border-radius:100px;margin:4px;font-size:13px}.toast{position:fixed;bottom:15px;left:10%;right:10%;background:#2f2853;color:white;padding:12px;border-radius:12px;text-align:center;z-index:20;display:none}


/* Live panels, placed exactly over the cleared illustration panels */
.stage{container-type:inline-size}
.today-card,.week-card{position:absolute;z-index:3;box-sizing:border-box;color:#493456;font-family:ui-rounded,"Trebuchet MS",Arial,sans-serif;background:#fff6eb;border:2px solid #e4c9c0;box-shadow:0 3px 8px #422d5a29}
.today-card{left:3.4%;top:22.3%;width:48.2%;height:15.65%;border-radius:4.2cqw;padding:2.2cqw 2.6cqw 1.7cqw;display:flex;flex-direction:column;gap:1.5cqw;overflow:hidden}
.today-head{display:flex;align-items:flex-start;justify-content:space-between;gap:1cqw;flex-shrink:0}
.today-title{font-size:4.3cqw;font-weight:800;line-height:1.2;white-space:nowrap;letter-spacing:-.02em}
.today-date{font-size:2.85cqw;line-height:1.2;margin-top:1.1cqw;color:#75617e;white-space:nowrap}
.today-count{font-size:2.85cqw;line-height:1.3;font-weight:700;text-align:right;white-space:nowrap}

.today-item input:checked{background:#43b68e;border-color:#43b68e}
.today-item input:checked:after{content:'✓';display:block;text-align:center;color:white;font-weight:900;font-size:3cqw;line-height:3.8cqw}

.week-card{left:53.7%;top:22.3%;width:43.6%;height:7.65%;border-radius:4cqw;padding:2.2cqw 2.6cqw;display:flex;flex-direction:column;justify-content:center;gap:1.6cqw;cursor:pointer;text-align:left}

.week-bar{height:1.5cqw;border-radius:20px;background:#e8dce8;overflow:hidden}.week-bar span{display:block;height:100%;background:#8e85d8}
 </style></head><body><div class="stage" aria-label="Illustrert eventyrhus med navigasjon"><section class="today-card" aria-label="Dagens oppgaver"><div class="today-head"><div><div class="today-title">☀️ I dag</div><div class="today-date" id="today-date"></div></div><div><div class="today-count" id="today-count"></div><div class="today-progress"><span id="today-progress"></span></div></div></div><div class="today-items" id="today-items"></div><button class="today-more" onclick="openSheet('today')">Se flere oppgaver ›</button></section><button class="week-card" onclick="openSheet('week')" aria-label="Åpne ukens oppgaver"><strong>📅 Denne uken ›</strong><small id="week-count"></small><div class="week-bar"><span id="week-progress"></span></div></button>

</div><div class="shade" id="shade" onclick="if(event.target===this)closeSheet()"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheettitle"><div class="sheethead"><h2 id="sheettitle"></h2><button class="close" aria-label="Lukk" onclick="closeSheet()">×</button></div><div id="sheetbody"></div></div></div><div id="toast" class="toast"></div><script>
const rooms=['Vaskerom','Gang og yttergang','Under trappen','Foreldrenes soverom','Adrians rom','Emilies rom','Stue og kjøkken','Bad og toalett','Loft/kontor'];
const initial=[['w1','Gå gjennom Adrians ukeplan','week',null,true],['w2','Sjekk barnehageinformasjon for Emilie','week',null,true],['r1','Sorter rene klær på vaskeromsbenken','room','Vaskerom',false],['r2','Sorter klærne på gulvet','room','Vaskerom',false],['r3','Gå gjennom ting under vasken','room','Vaskerom',false],['r4','Rydd tingene oppå varmtvannsberederen','room','Vaskerom',false],['r5','Sorter sko i gangen','room','Gang og yttergang',false],['r6','Rydd kommoden ved speilet','room','Gang og yttergang',false],['r7','Rydd eskene foran skuffene','room','Under trappen',false],['r8','Sorter én kurv i garderoben','room','Foreldrenes soverom',false],['r9','Gå gjennom klærhaugen på gulvet','room','Foreldrenes soverom',false],['r10','Rydd skapet med foreldrenes ting','room','Adrians rom',false],['r11','Gå gjennom ting i høyskapet','room','Emilies rom',false]].map(([id,title,kind,room,recurring])=>({id,title,kind,room,recurring,done:false}));
const key='hjemme-elias-magisk-v1';let state;try{state=JSON.parse(localStorage.getItem(key))}catch{}if(!state||!Array.isArray(state.tasks))state={tasks:initial,week:weekKey()};function todayLabel(){return new Intl.DateTimeFormat('nb-NO',{weekday:'long',day:'numeric',month:'short',timeZone:'Europe/Oslo'}).format(new Date())}function updateDate(){renderHome()}document.addEventListener('visibilitychange',()=>{if(!document.hidden)renderHome()});function weekKey(){let d=new Date();d.setDate(d.getDate()-(d.getDay()+6)%7);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}if(state.week!==weekKey()){state.tasks.forEach(t=>{if(t.recurring)t.done=false});state.week=weekKey();save()}function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch{toast('Lagring er blokkert i denne visningen. Åpne appen i Safari.')}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(s){let e=document.getElementById('toast');e.textContent=s;e.style.display='block';setTimeout(()=>e.style.display='none',3200)}function closeSheet(){document.getElementById('shade').classList.remove('show')}let current='overview',currentRoom='Vaskerom';function openRoom(r){currentRoom=r;openSheet('room')}function openSheet(s){current=s;let title={today:'☀️ I dag',week:'📅 Denne uken',house:'🏡 Hele huset',bedrooms:'🛏️ Soverom',hall:'🧺 Gang og bod',declutter:'✨ Declutter-prosjektet',overview:'🏰 Min oversikt',progress:'💜 Fremdrift',sync:'💌 Samkjør med Elias',room:'🗝️ '+currentRoom}[s];document.getElementById('sheettitle').textContent=title;document.getElementById('shade').classList.add('show');render()}
function taskHtml(t){return `<div class="task ${t.done?'done':''}"><input aria-label="Fullfør ${esc(t.title)}" type="checkbox" ${t.done?'checked':''} onchange="toggle('${t.id}',this.checked)"><label>${esc(t.title)}</label><button class="del" aria-label="Slett" onclick="removeTask('${t.id}')">×</button></div>`}function tasks(a){return a.length?a.map(taskHtml).join(''):'<p class="muted">Ingen oppgaver her ennå.</p>'}function meter(a){let n=a.filter(t=>t.done).length;return `<div class="meter"><div class="fill" style="width:${a.length?100*n/a.length:0}%"></div></div><p class="muted">${n} av ${a.length} oppgaver fullført</p>`}function toggle(id,done){let t=state.tasks.find(x=>x.id===id);if(t){t.done=done;save();renderHome();if(document.getElementById("shade").classList.contains("show"))render()}}function removeTask(id){if(confirm('Vil du slette oppgaven?')){state.tasks=state.tasks.filter(t=>t.id!==id);save();renderHome();render()}}function addTask(kind,room){let el=document.getElementById('newtask'),title=el.value.trim();if(!title)return;state.tasks.push({id:'t'+Date.now(),title,kind,room,recurring:false,done:false});save();renderHome();render()}function addForm(kind,room){return `<h3>Legg til oppgave</h3><input class="field" id="newtask" placeholder="En liten, konkret oppgave"><div class="actions"><button class="btn" onclick="addTask('${kind}',${room?`'${room}'`:'null'})">Legg til</button></div>`}function roomList(arr){return arr.map(r=>{let a=state.tasks.filter(t=>t.room===r);return `<button class="room" onclick="openRoom('${r}')">${esc(r)} <b>${a.filter(t=>t.done).length}/${a.length} ›</b></button>`}).join('')}
function renderHome(){
 const date=document.getElementById('today-date');if(!date)return;
 date.textContent=todayLabel();
 const w=state.tasks.filter(t=>t.kind==='week'),r=state.tasks.filter(t=>t.kind==='room');
 const pick=w.concat(r).slice(0,3),finished=pick.filter(t=>t.done).length;
 document.getElementById('today-count').textContent=finished+' av '+pick.length;
 document.getElementById('today-progress').style.width=(pick.length?100*finished/pick.length:0)+'%';
 document.getElementById('today-items').innerHTML=pick.map(t=>'<label class="today-item '+(t.done?'done':'')+'"><input type="checkbox" '+(t.done?'checked':'')+' onchange="toggle('+JSON.stringify(t.id).replace(/"/g,'&quot;')+',this.checked)"><span title="'+esc(t.title)+'">'+esc(t.title)+'</span></label>').join('') || '<small>Ingen oppgaver ennå ✨</small>';
 const n=w.filter(t=>t.done).length;
 document.getElementById('week-count').textContent=n+' av '+w.length+' oppgaver';
 document.getElementById('week-progress').style.width=(w.length?100*n/w.length:0)+'%';
}
function render(){let w=state.tasks.filter(t=>t.kind==='week'),r=state.tasks.filter(t=>t.kind==='room'),a=state.tasks;let body='';switch(current){case 'today':body='<p class="muted">'+esc(todayLabel())+'</p><p class="muted">Dagens lille innsats. Kryss av når du er ferdig.</p>'+tasks(w.filter(t=>!t.done).concat(r.filter(t=>!t.done).slice(0,3)))+'<button class="btn secondary" onclick="openSheet(&quot;week&quot;)">Se hele uken</button>';break;case 'week':body=meter(w)+tasks(w)+addForm('week',null);break;case 'house':body='<p class="muted">Velg rommet du vil rydde.</p>'+roomList(rooms);break;case 'bedrooms':body=roomList(rooms.filter(x=>x.includes('soverom')||x.includes('rom')));break;case 'hall':body=roomList(['Gang og yttergang','Under trappen','Vaskerom']);break;case 'room':{let t=a.filter(x=>x.room===currentRoom);body=meter(t)+tasks(t)+addForm('room',currentRoom);break}case 'declutter':body=meter(r)+'<p class="muted">Rom for rom, i ditt eget tempo.</p>'+roomList(rooms);break;case 'overview':body='<p>Velkommen til din lille eventyrverden! ✨</p>'+meter(a)+'<div class="actions"><button class="btn" onclick="openSheet(&quot;today&quot;)">I dag</button><button class="btn secondary" onclick="openSheet(&quot;house&quot;)">Hele huset</button></div><p class="hint">Tallene som er tegnet inn på eventyrbildet, er foreløpig illustrasjoner. De virkelige tallene oppdateres her når du krysser av.</p>';break;case 'progress':body='<h3>Hele ryddeprosjektet</h3>'+meter(a)+'<h3>Ukens oppgaver</h3>'+meter(w)+'<h3>Declutter</h3>'+meter(r);break;case 'sync':body='<p>På søndag kan du kopiere status til samtalen vår. Jeg lager forslag til neste uke, og du kan importere oppdateringene tilbake.</p><button class="btn" onclick="exportElias()">📋 Kopier status til Elias</button><h3>Importer fra Elias</h3><p class="muted">Lim inn JSON-oppdateringen jeg lager. Se endringene før du godkjenner.</p><textarea class="field fieldarea" id="import" placeholder="Lim inn JSON her"></textarea><div class="actions"><button class="btn secondary" onclick="preview()">Forhåndsvis</button><button class="btn" onclick="apply()">Godkjenn</button></div><p id="importstatus" class="muted"></p><h3>Sikkerhetskopi</h3><p class="muted">Oppgavene lagres lokalt på iPhonen. Lagre en kopi jevnlig – Safari-data kan slettes.</p><div class="actions"><button class="btn secondary" onclick="backup()">Lagre kopi</button><button class="btn secondary" onclick="document.getElementById(&quot;file&quot;).click()">Gjenopprett</button></div><input type="file" id="file" accept=".json,application/json" hidden onchange="restore(event)">';break}document.getElementById('sheetbody').innerHTML=body}
function exportElias(){let txt='Elias, her er status fra Hjemme med Elias. Hjelp meg med neste uke. Når vi er enige, gi meg en fullstendig JSON for import, med alle eksisterende oppgaver og ID-er beholdt. Ikke slett noe uten avtale. Data:\n'+JSON.stringify({app:'Hjemme med Elias',version:1,tasks:state.tasks},null,2);navigator.clipboard.writeText(txt).then(()=>toast('Kopiert! Lim inn i ChatGPT.')).catch(()=>{prompt('Kopier denne teksten:',txt)})}let pending=null;function parse(){let raw=document.getElementById('import').value.trim().replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'');let o=JSON.parse(raw);if(!o||!Array.isArray(o.tasks)||o.tasks.length>2000)throw Error('Mangler oppgaveliste');let ids=new Set();o.tasks.forEach(t=>{if(typeof t.id!=='string'||!t.id||ids.has(t.id)||typeof t.title!=='string'||!t.title.trim()||!['week','room'].includes(t.kind)||typeof t.done!=='boolean'||typeof t.recurring!=='boolean'||(t.kind==='room'&&!rooms.includes(t.room))||(t.kind==='week'&&t.room!==null))throw Error('Ugyldig oppgave eller duplikat');ids.add(t.id)});return o.tasks.map(t=>({id:t.id,title:t.title,kind:t.kind,room:t.room,recurring:t.recurring,done:t.done}))}function preview(){try{pending=parse();let old=new Map(state.tasks.map(t=>[t.id,t]));let added=pending.filter(t=>!old.has(t.id)).length,changed=pending.filter(t=>old.has(t.id)&&JSON.stringify(t)!==JSON.stringify(old.get(t.id))).length,removed=state.tasks.filter(t=>!pending.some(x=>x.id===t.id)).length;document.getElementById('importstatus').textContent=`${added} nye, ${changed} endret, ${removed} slettet. Kontroller før godkjenning.`}catch(e){pending=null;document.getElementById('importstatus').textContent='Kunne ikke lese oppdateringen: '+e.message}}function apply(){preview();if(pending&&confirm('Erstatte oppgavelisten med importen?')){state.tasks=pending;save();toast('Importert!');render()}}function backup(){let b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='hjemme-med-elias-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}async function restore(e){try{let o=JSON.parse(await e.target.files[0].text());if(!o||!Array.isArray(o.tasks))throw Error('Ugyldig fil');if(confirm('Erstatte eksisterende oppgaver?')){state=o;save();renderHome();render();toast('Gjenopprettet')}}catch(err){toast('Kunne ikke lese filen')}}
renderHome();setInterval(renderHome,60000);if('serviceWorker' in navigator && location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
