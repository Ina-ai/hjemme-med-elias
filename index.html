.today-card,.week-card{position:absolute;z-index:3;box-sizing:border-box;color:#3b285b;font-family:'Trebuchet MS',ui-rounded,'Arial Rounded MT Bold',sans-serif;background:linear-gradient(145deg,rgba(255,243,229,.79),rgba(248,226,250,.69));border:1.3px solid rgba(255,248,239,.90);box-shadow:0 3px 12px rgba(52,29,65,.22),inset 0 1px 1px rgba(255,255,255,.68);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
.today-card{left:3.4%;top:22.3%;width:48.2%;height:15.65%;border-radius:4.2cqw;padding:2cqw 2.4cqw 1.7cqw;display:flex;flex-direction:column;gap:1.3cqw;overflow:hidden}
.today-head{display:flex;align-items:flex-start;justify-content:space-between;gap:1cqw;flex-shrink:0}
.today-title{font-family:'Trebuchet MS',ui-rounded,'Arial Rounded MT Bold',sans-serif;font-size:3.8cqw;font-weight:700;line-height:1.25;white-space:nowrap;letter-spacing:-.03em}
.today-date{font-size:2.65cqw;line-height:1.25;margin-top:.8cqw;color:#674b78;white-space:nowrap}
.today-count{font-size:2.7cqw;line-height:1.4;font-weight:700;text-align:right;white-space:nowrap}
.today-progress{height:1.2cqw;background:rgba(127,98,151,.19);border-radius:15px;overflow:hidden;margin-top:1.3cqw;min-width:8cqw}
.today-progress>span{display:block;height:100%;background:#58b990;border-radius:15px}
.today-items{display:flex;flex:1;min-height:0;flex-direction:column;justify-content:space-evenly;gap:.8cqw;overflow:hidden}
.today-item{display:flex;align-items:center;gap:1.4cqw;flex:1;min-height:0;font-size:2.1cqw;font-family:'Trebuchet MS',ui-rounded,sans-serif;line-height:1.18;cursor:pointer;border:1px solid rgba(255,255,255,.30);border-radius:2cqw;padding:0 .6cqw;background:rgba(255,255,255,.30);font-family:'Comic Sans MS','Segoe Print','Trebuchet MS',cursive,sans-serif}
.today-item input{appearance:none;flex-shrink:0;width:3.7cqw;height:3.7cqw;margin:0;border:1.5px solid #877295;border-radius:50%;background:rgba(255,255,255,.84);cursor:pointer}
.today-item input:checked{background:#43b68e;border-color:#43b68e}
.today-item input:checked:after{content:'✓';display:block;text-align:center;color:white;font-weight:900;font-size:2.8cqw;line-height:3.5cqw}
.today-item span{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;display:block}
.today-item.done span{text-decoration:line-through;opacity:.65}
.today-more{border:0;background:transparent;color:#624578;text-align:center;font-size:2.7cqw;line-height:1.2;font-family:'Comic Sans MS','Segoe Print','Trebuchet MS',cursive,sans-serif;font-weight:700;padding:0;cursor:pointer;flex-shrink:0}
.week-card{left:53.7%;top:22.3%;width:43.6%;height:7.65%;border-radius:4cqw;padding:2cqw 2.5cqw;display:flex;flex-direction:column;justify-content:center;gap:1.4cqw;cursor:pointer;text-align:left}
.week-card strong{font-family:'Trebuchet MS',ui-rounded,'Arial Rounded MT Bold',sans-serif;font-size:3.5cqw;font-weight:700;line-height:1.2;white-space:nowrap;letter-spacing:-.03em}
.week-card small{font-size:2.65cqw;line-height:1.2;color:#674b78}
.week-bar{height:1.2cqw;border-radius:20px;background:rgba(127,98,151,.2);overflow:hidden}
.week-bar span{display:block;height:100%;background:#8e85d8}
.task label .schedule{display:block;font-size:.76em;font-weight:400;opacity:.7;margin-top:4px}.task label span{display:block}
/* Live fremdrift erstatter tallet som var malt inn i bakgrunnsbildet. */
.declutter-card{position:absolute;z-index:4;left:3.7%;top:72.55%;width:42.5%;height:7.7%;border:1px solid #e6d5df;border-radius:5cqw;background:linear-gradient(135deg,rgba(255,247,241,.96),rgba(241,226,243,.96));box-shadow:0 3px 10px #3a22481a;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);display:flex;flex-direction:column;justify-content:center;align-items:stretch;text-align:left;gap:1.2cqw;padding:2.3cqw 2.6cqw;color:#39254e;cursor:pointer;font-family:'Trebuchet MS',ui-rounded,sans-serif;}
.declutter-title{font-weight:700;font-size:2.9cqw;white-space:nowrap;}
.declutter-sub{font-size:2.5cqw;}
.declutter-track{height:2.6cqw;border-radius:10cqw;background:#d9cbd8;overflow:hidden;}
.declutter-track span{display:block;height:100%;width:0;background:#5ac69b;border-radius:10cqw;}
.field#newday{display:block;width:100%;margin-top:8px;margin-bottom:12px;color:#39254e;background:#fffafc}.task-day{padding:6px 8px;font-size:13px;margin-top:5px}.task label .schedule{display:block}

const weekdays=['Mandag','Tirsdag','Onsdag','Torsdag','Fredag','Lørdag','Søndag'];
function customDayLabel(t){return t.day===undefined||t.day===null?'Når som helst denne uken':weekdays[Number(t.day)]||'Når som helst denne uken'}
function customToday(){return currentCustom().filter(t=>t.day!==undefined&&t.day!==null&&Number(t.day)===weekIndex())}
function changeCustomDay(id,val){let t=state.customWeek.find(x=>x.id===id);if(!t)return;t.day=val===''?null:Number(val);save();renderHome();render()}
function customTaskHtml(t){return `<div class="task ${t.done?'done':''}"><input type="checkbox" aria-label="Fullfør ${esc(t.title)}" ${t.done?'checked':''} onchange="toggle('${t.id}',this.checked)"><label><span>${esc(t.title)}</span><select aria-label="Velg dag for ${esc(t.title)}" class="field task-day" onchange="changeCustomDay('${t.id}',this.value)"><option value="" ${t.day==null?'selected':''}>Denne uken</option>${weekdays.map((d,i)=>`<option value="${i}" ${Number(t.day)===i&&t.day!=null?'selected':''}>${d}</option>`).join('')}</select></label><button class="del" aria-label="Slett" onclick="removeTask('${t.id}')">×</button></div>`}
function customWeekForm(){return `<h3>Legg til oppgave</h3><input class="field" id="newtask" placeholder="Hva skal gjøres?"><label class="muted" for="newday">Når skal den gjøres?</label><select class="field" id="newday"><option value="">Når som helst denne uken</option>${weekdays.map((d,i)=>`<option value="${i}">${d}</option>`).join('')}</select><div class="actions"><button class="btn" onclick="addTask('week',null)">Legg til</button></div>`}

function todayRoutines(){return activeRoutines().filter(r=>routineApplicableToday(r))}
function renderHome(){
 let date=document.getElementById('today-date');if(!date)return;
 date.textContent=todayLabel();
 let a=todayRoutines(),visible=a.map(r=>({title:r.title,done:routineDone(r),id:r.id,routine:true})).concat(customToday().map(t=>({...t,routine:false}))).slice(0,3),done=visible.filter(t=>t.done).length;
 document.getElementById('today-count').textContent=done+' av '+visible.length;
 document.getElementById('today-progress').style.width=(visible.length?100*done/visible.length:0)+'%';
 document.getElementById('today-items').innerHTML=visible.map(t=>`<label class="today-item ${t.done?'done':''}"><input type="checkbox" ${t.done?'checked':''} onchange="${t.routine?'toggleRoutine':'toggle'}('${t.id}',this.checked)"><span title="${esc(t.title)}">${esc(t.title)}</span></label>`).join('')||'<small>Alt er gjort for i dag ✨</small>';
 let roomTasks=state.tasks.filter(t=>t.kind==='room'),finished=roomTasks.filter(t=>t.done).length;
 document.getElementById('declutter-count').textContent=finished+' av '+roomTasks.length+' oppgaver';
 document.getElementById('declutter-progress').style.width=(roomTasks.length?100*finished/roomTasks.length:0)+'%';
 let w=activeRoutines(),n=w.filter(r=>routineDone(r)).length;
 document.getElementById('week-count').textContent=n+' av '+w.length+' rutiner';
 document.getElementById('week-progress').style.width=(w.length?100*n/w.length:0)+'%';
}
function render(){let r=state.tasks.filter(t=>t.kind==='room'),a=activeRoutines(),custom=currentCustom(),body='';switch(current){
 case 'today':body='<p class="muted">'+esc(todayLabel())+'</p><p class="muted">Dagens rutiner og oppgaver du har lagt til for denne dagen.</p>'+ (todayRoutines().length?todayRoutines().map(routineHtml).join(''):'')+customToday().map(customTaskHtml).join('')+(!todayRoutines().length&&!customToday().length?'<p class="muted">Ingen oppgaver planlagt i dag ✨</p>':'')+'<button class="btn secondary" onclick="openSheet(&quot;week&quot;)">Se hele uken</button>';break;
 case 'week':body='<p class="muted">Faste rutiner kommer tilbake automatisk. Helg betyr fredag, lørdag eller søndag.</p>'+routineMeter(a)+a.map(routineHtml).join('')+'<h3>Andre oppgaver denne uken</h3>'+(custom.length?custom.map(customTaskHtml).join(''):'<p class="muted">Ingen ekstra oppgaver ennå.</p>')+customWeekForm();break;
 case 'house':body='<p class="muted">Velg rommet du vil rydde når du har tid.</p>'+roomList(rooms);break;
 case 'bedrooms':body=roomList(['Foreldrenes soverom','Adrians rom','Emilies rom']);break;
 case 'hall':body=roomList(['Gang og yttergang','Under trappen','Vaskerom','Bad','Separat toalett']);break;
 case 'living':body=roomList(['Stue – Kroken','Stue – Hobbyavdelingen','Stue – Oppbevaring','Kjøkken']);break;
 case 'room':{let t=r.filter(x=>x.room===currentRoom);body=meter(t)+tasks(t)+addForm('room',currentRoom);break}
 case 'declutter':body='<p class="muted">Disse oppgavene venter til du selv har tid. Ferdige oppgaver forblir ferdige.</p>'+meter(r)+roomList(rooms);break;
 case 'overview':body='<p>Små rutiner holder huset i gang. Større ryddeprosjekter tar vi i ditt tempo. 💜</p><h3>Ukens rutiner</h3>'+routineMeter(a)+'<h3>Ryddeprosjektet</h3>'+meter(r)+'<div class="actions"><button class="btn" onclick="openSheet(&quot;today&quot;)">I dag</button><button class="btn secondary" onclick="openSheet(&quot;house&quot;)">Hele huset</button></div>';break;
 case 'progress':body='<h3>Faste rutiner denne uken</h3>'+routineMeter(a)+'<h3>Større ryddeprosjekt – totalt</h3>'+meter(r)+'<p class="muted">Ryddeoppgavene nullstilles ikke når en ny uke begynner.</p>'+roomList(rooms);break;
 case 'sync':body='<p>Kopier status til samtalen vår når du ønsker å planlegge videre. Vi beholder rutinene og ryddefremdriften.</p><button class="btn" onclick="exportElias()">📋 Kopier status til Elias</button><h3>Importer oppgaver fra Elias</h3><p class="muted">Lim inn JSON med romoppgaver. Ta en sikkerhetskopi først.</p><textarea class="field fieldarea" id="import" placeholder="Lim inn JSON her"></textarea><div class="actions"><button class="btn secondary" onclick="preview()">Forhåndsvis</button><button class="btn" onclick="apply()">Godkjenn</button></div><p id="importstatus" class="muted"></p><h3>Sikkerhetskopi</h3><p class="muted">Data lagres lokalt på denne enheten, ikke på GitHub. Ta sikkerhetskopi jevnlig.</p><div class="actions"><button class="btn secondary" onclick="backup()">Lagre kopi</button><button class="btn secondary" onclick="document.getElementById(&quot;file&quot;).click()">Gjenopprett</button></div><input type="file" id="file" accept=".json,application/json" hidden onchange="restore(event)">';break;
 }document.getElementById('sheetbody').innerHTML=body}
function exportElias(){let txt='Elias, her er status fra Hjemme med Elias. Faste rutiner er innebygd i appen. Hjelp meg med ryddeprosjektet, men behold oppgaver og ID-er. Data:\n'+JSON.stringify({app:'Hjemme med Elias',version:2,week:weekKey(),routineDone:state.routineDone,routines:activeRoutines(),tasks:state.tasks,customWeek:state.customWeek},null,2);navigator.clipboard.writeText(txt).then(()=>toast('Kopiert! Lim inn i ChatGPT.')).catch(()=>prompt('Kopier denne teksten:',txt))}
let pending=null;
function parse(){let raw=document.getElementById('import').value.trim().replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'');let o=JSON.parse(raw);if(!o||!Array.isArray(o.tasks)||o.tasks.length>2000)throw Error('Mangler oppgaveliste');let ids=new Set();o.tasks.forEach(t=>{if(typeof t.id!=='string'||!t.id||ids.has(t.id)||typeof t.title!=='string'||!t.title.trim()||t.kind!=='room'||typeof t.done!=='boolean'||!rooms.includes(t.room))throw Error('Ugyldig romoppgave eller duplikat');ids.add(t.id)});return o.tasks.map(t=>({id:t.id,title:t.title,kind:'room',room:t.room,cycle:t.cycle||'once',done:t.done,doneAt:t.doneAt||null}))}
function preview(){try{pending=parse();let old=new Map(state.tasks.map(t=>[t.id,t]));let added=pending.filter(t=>!old.has(t.id)).length,changed=pending.filter(t=>old.has(t.id)&&JSON.stringify(t)!==JSON.stringify(old.get(t.id))).length,removed=state.tasks.filter(t=>!pending.some(x=>x.id===t.id)).length;document.getElementById('importstatus').textContent=`${added} nye, ${changed} endret, ${removed} slettet. Rutiner beholdes.`}catch(e){pending=null;document.getElementById('importstatus').textContent='Kunne ikke lese oppdateringen: '+e.message}}
function apply(){preview();if(pending&&confirm('Erstatte romoppgavene? Faste rutiner beholdes.')){state.tasks=pending;save();toast('Importert!');renderHome();render()}}
function backup(){let b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='hjemme-med-elias-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
async function restore(e){try{let o=JSON.parse(await e.target.files[0].text());if(!o||!Array.isArray(o.tasks))throw Error('Ugyldig fil');if(confirm('Erstatte eksisterende oppgaver og status?')){state=o;if(!state.routineDone)state.routineDone={};if(!state.customWeek)state.customWeek=[];save();renderHome();render();toast('Gjenopprettet')}}catch(err){toast('Kunne ikke lese filen')}}
function refresh(){renderHome();if(isSheetOpen())render()}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
renderHome();setInterval(refresh,60000);
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
